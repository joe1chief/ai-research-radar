  # Media is discovery-only. These sources never alert and only enter the
  # digest observation section after two independent reports cluster together.
  - id: latepost-discovery
    entity_id: media_latepost
    group: capital
    kind: html
    url: https://www.latepost.com/
    fetch_strategy: html_listing
    cadence: four_hour
    evidence_type: reputable_media
    parser: html_links
    include_url_patterns: ['/news/']
    exclude_title_patterns: ['^查看更多$|^晚点独家$']
    detail_fetch_limit: 0
    max_items: 40
    # The origin currently serves an incomplete TLS certificate chain. Keep
    # verification strict and re-enable only after the publisher fixes it.
    enabled: false
  - id: reuters-ai-discovery
    entity_id: media_reuters
    group: capital
    kind: sitemap
    url: https://www.reuters.com/arc/outboundfeeds/sitemap/?outputType=xml
    fetch_strategy: xml_sitemap
    cadence: four_hour
    evidence_type: reputable_media
    parser: sitemap_xml
    include_url_patterns:
      - '/artificial-intelligence/'
      - '/[^/]*(?:openai|anthropic|deepseek|nvidia|xai|mistral|minimax|zhipu|data-center|export-control)[^/]*/?'
    max_items: 40
    allow_empty: true
    enabled: true
  - id: bloomberg-ai-discovery
    entity_id: media_bloomberg
    group: capital
    kind: rss
    url: https://feeds.bloomberg.com/technology/news.rss
    fetch_strategy: rss
    cadence: four_hour
    evidence_type: reputable_media
    parser: rss
    max_items: 80
    enabled: true
  - id: ft-ai-discovery
    entity_id: media_ft
    group: capital
    kind: rss
    url: https://www.ft.com/artificial-intelligence?format=rss
    fetch_strategy: rss
    cadence: four_hour
    evidence_type: reputable_media
    parser: rss
    max_items: 80
    enabled: true
  - id: thirtysixkr-ai-discovery
    entity_id: media_36kr
    group: capital
    kind: html
    url: https://36kr.com/information/AI/
    fetch_strategy: html_listing
    cadence: four_hour
    evidence_type: reputable_media
    parser: html_links
    include_url_patterns: ['/p/']
    exclude_title_patterns: ['^核心服务$']
    detail_fetch_limit: 0
    max_items: 40
    enabled: true

  - id: sensetime-ir
    entity_id: sensetime
    group: capital
    kind: html
    url: https://www.sensetime.com/cn/investor_corp_governance
    fetch_strategy: html_listing
    cadence: four_hour
    evidence_type: official_company
    parser: html_links
    include_url_patterns: ['\.pdf(?:$|\?)']
    detail_fetch_limit: 0
    max_items: 50
    enabled: true

  - id: uk-aisi-research
    entity_id: uk_aisi
    group: standards
    kind: html
    url: https://www.aisi.gov.uk/research
    fetch_strategy: html_listing
    cadence: daily
    evidence_type: official_standard
    parser: html_links
    include_url_patterns: ['^https://www\.aisi\.gov\.uk/research/[^/?#]+$']
    detail_fetch_limit: 5
    max_items: 100
    enabled: true
  - id: nist-ai-rmf
    entity_id: nist
    group: standards
    kind: html
    url: https://www.nist.gov/itl/ai-risk-management-framework
    fetch_strategy: html_listing
    cadence: daily
    evidence_type: official_standard
    parser: html_links
    include_url_patterns:
      - '^https://www\.nist\.gov/itl/ai-risk-management-framework/[^/?#]+$'
      - '^https://www\.nist\.gov/(?:document|programs-projects)/.*(?:ai-rmf|ai-risk|artificial-intelligence-risk)'
      - '^https://nvlpubs\.nist\.gov/nistpubs/ai/NIST\.AI\..*\.pdf$'
      - '^https://airc\.nist\.gov/(?:airmf-resources|AI_RMF_Knowledge_Base)/'
    exclude_url_patterns: ['/webform/|/topics(?:/|$)']
    detail_fetch_limit: 0
    max_items: 100
    enabled: true
  - id: samr-ai-standards
    entity_id: samr
    group: standards
    kind: samr_standards
    url: https://std.samr.gov.cn/gb/search/gbQueryPage
    fetch_strategy: samr_official_json_search
    cadence: daily
    evidence_type: official_standard
    cursor_strategy: keyword_snapshot
    parser: samr_json
    search_terms: [人工智能, 大模型]
    page_size: 50
    max_pages_per_term: 4
    enabled: true
