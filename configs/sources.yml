version: 1
defaults:
  timeout_seconds: 12
  cadence: daily
  cursor_strategy: etag_last_modified
  detail_fetch_limit: 12
  filing_detail_limit: 5
sources:
  # =========================================================================
  # 1. Academic & Open Research Papers (arXiv, OpenReview, PMLR, ACL)
  # =========================================================================
  - id: arxiv-topic-api
    entity_id: arxiv
    group: papers
    kind: arxiv_api
    url: https://export.arxiv.org/api/query
    fetch_strategy: arxiv_query
    cadence: daily
    evidence_type: paper
    cursor_strategy: updated_at_overlap
    parser: atom
    page_size: 100
    max_pages: 8
    request_interval_seconds: 3
    enabled: true

  - id: arxiv-oai-reconcile
    entity_id: arxiv
    group: papers
    kind: arxiv_oai
    url: https://oaipmh.arxiv.org/oai
    fetch_strategy: oai_pmh_incremental
    cadence: daily
    evidence_type: paper
    cursor_strategy: oai_datestamp_resumption_token
    parser: arxiv_raw_xml
    sets: [cs:cs:AI, cs:cs:CL, cs:cs:LG, cs:cs:MA, cs:cs:SE, cs:cs:RO, cs:cs:CR]
    max_pages: 20
    request_interval_seconds: 3
    enabled: true

  - id: openreview-frontier-venues
    entity_id: openreview
    group: papers
    kind: openreview_api
    url: https://api2.openreview.net/notes
    fetch_strategy: accepted_venue_notes
    cadence: daily
    evidence_type: paper
    cursor_strategy: note_revision
    parser: openreview_json
    venue_ids: [ICLR.cc/2026/Conference, ICML.cc/2026/Conference, NeurIPS.cc/2026/Conference]
    page_size: 1000
    enabled: true

  - id: acl-anthology-recent
    entity_id: acl_anthology
    group: papers
    kind: acl_anthology
    url: https://aclanthology.org/
    fetch_strategy: recent_event_pages
    cadence: daily
    evidence_type: paper
    cursor_strategy: etag_last_modified
    parser: acl_event_html
    years_back: 1
    event_limit: 12
    request_interval_seconds: 0.5
    enabled: true

  - id: pmlr-recent
    entity_id: pmlr
    group: papers
    kind: pmlr
    url: https://proceedings.mlr.press/
    fetch_strategy: recent_volume_rss
    cadence: daily
    evidence_type: paper
    cursor_strategy: etag_last_modified
    parser: rss
    volume_limit: 6
    request_interval_seconds: 0.5
    enabled: true

