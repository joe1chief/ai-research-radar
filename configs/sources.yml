  # =========================================================================
  # 6. Global AI Industry Capital Intelligence (Reuters, Bloomberg, FT)
  # =========================================================================
  - id: reuters-ai-discovery
    entity_id: media_reuters
    group: capital
    kind: sitemap
    url: https://www.reuters.com/arc/outboundfeeds/sitemap/?outputType=xml
    fetch_strategy: xml_sitemap
    cadence: four_hour
    evidence_type: reputable_media
    parser: sitemap_xml
    include_url_patterns:
      - '/artificial-intelligence/'
      - '/[^/]*(?:openai|anthropic|nvidia|xai|mistral|scale-ai|perplexity|cognition|cursor|data-center)[^/]*/?'
    max_items: 40
    allow_empty: true
    enabled: true

