[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-research-radar"
version = "0.1.0"
description = "Incremental AI research and industry intelligence radar"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Research Radar" }]
dependencies = [
  "agentmail>=0.2.6",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
  "typer>=0.15.1",
]

[project.scripts]
radar = "ai_research_radar.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_research_radar"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/backend"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
