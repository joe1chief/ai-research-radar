name: Model Provider Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm_external_call:
        description: Confirm a real, billable request to YiCloud TokenFactory
        required: true
        default: false
        type: boolean
      classifier_model:
        description: Optional YiCloud classifier model override
        required: false
        type: string
      summarizer_model:
        description: Optional YiCloud summarizer model override
        required: false
        type: string
      json_response_format:
        description: Optional true/false override; false tests prompt-only JSON
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LLM_PROVIDER: yicloud
  LLM_BASE_URL: https://token-api.yicloud.com/v1
  LLM_CLASSIFIER_MODEL: ${{ inputs.classifier_model || vars.YICLOUD_CLASSIFIER_MODEL || 'required-yicloud-classifier-model' }}
  LLM_SUMMARIZER_MODEL: ${{ inputs.summarizer_model || vars.YICLOUD_SUMMARIZER_MODEL || 'required-yicloud-summarizer-model' }}
  LLM_JSON_RESPONSE_FORMAT: ${{ inputs.json_response_format || vars.YICLOUD_JSON_RESPONSE_FORMAT || 'true' }}
  LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '1200' }}
  LLM_EMBEDDING_MODE: local
  LLM_EMBEDDING_MODEL: feature-hash-v1
  LLM_EMBEDDING_DIMENSIONS: "1024"

jobs:
  smoke:
    if: github.ref_name == github.event.repository.default_branch && inputs.confirm_external_call
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked --all-extras
          else
            uv sync --all-extras
          fi
      - name: Verify authenticated YiCloud model contract
        env:
          LLM_API_KEY: ${{ secrets.YICLOUD_API_KEY }}
        run: |
          infra/scripts/validate-runtime-env.sh model
          uv run radar model-smoke
