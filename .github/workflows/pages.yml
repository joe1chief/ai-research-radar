name: Publish Radar Archive

on:
  workflow_run:
    workflows: ["Collect and Alert", "Daily Digest", "Maintenance"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Publish every 4 hours at :35 (shortly after the :17 collection schedule)
    - cron: "35 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  APP_ENV: production
  APP_TIMEZONE: Asia/Shanghai
  RADAR_USER_AGENT: ${{ vars.RADAR_USER_AGENT }}
  RADAR_PUBLIC_DATA_PATH: web/public/data/latest.json

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'schedule') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked --all-extras
          else
            uv sync --all-extras
          fi
      - name: Validate export environment
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: infra/scripts/validate-runtime-env.sh database
      - name: Test backend and deployment contract
        run: |
          uv run pytest -q
          python infra/scripts/validate-infra.py
      - name: Export sanitized public data
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run radar export-web --output web/public/data/latest.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Build archive
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ vars.RADAR_PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: |
          pnpm test
          pnpm build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
