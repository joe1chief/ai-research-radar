name: Collect and Alert

on:
  schedule:
    # Every four hours at :17. UTC and Asia/Shanghai four-hour boundaries align.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-database-writer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  APP_ENV: production
  APP_TIMEZONE: Asia/Shanghai
  RADAR_USER_AGENT: ${{ vars.RADAR_USER_AGENT }}
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'dashscope' }}
  LLM_BASE_URL: ${{ vars.LLM_PROVIDER == 'yicloud' && 'https://token-api.yicloud.com/v1' || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
  LLM_CLASSIFIER_MODEL: ${{ vars.LLM_PROVIDER == 'yicloud' && (vars.YICLOUD_CLASSIFIER_MODEL || 'required-yicloud-classifier-model') || (vars.DASHSCOPE_CLASSIFIER_MODEL || 'qwen-flash') }}
  LLM_SUMMARIZER_MODEL: ${{ vars.LLM_PROVIDER == 'yicloud' && (vars.YICLOUD_SUMMARIZER_MODEL || 'required-yicloud-summarizer-model') || (vars.DASHSCOPE_SUMMARIZER_MODEL || 'qwen-plus') }}
  LLM_JSON_RESPONSE_FORMAT: ${{ vars.LLM_PROVIDER == 'yicloud' && (vars.YICLOUD_JSON_RESPONSE_FORMAT || 'true') || (vars.DASHSCOPE_JSON_RESPONSE_FORMAT || 'true') }}
  LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '1200' }}
  LLM_EMBEDDING_MODE: ${{ vars.LLM_PROVIDER == 'yicloud' && 'local' || 'shared' }}
  LLM_EMBEDDING_MODEL: ${{ vars.LLM_PROVIDER == 'yicloud' && 'feature-hash-v1' || (vars.DASHSCOPE_EMBEDDING_MODEL || 'text-embedding-v4') }}
  LLM_EMBEDDING_DIMENSIONS: "1024"
  LLM_DAILY_REEMBED_LIMIT: "100"
  DELIVERY_MODE: ${{ vars.DELIVERY_MODE || 'shadow' }}
  RADAR_DRY_RUN: ${{ vars.RADAR_DRY_RUN || 'true' }}

jobs:
  collect-alert:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked --all-extras
          else
            uv sync --all-extras
          fi
      - name: Reject unsupported model provider
        if: env.LLM_PROVIDER != 'dashscope' && env.LLM_PROVIDER != 'yicloud'
        run: infra/scripts/validate-runtime-env.sh model
      - name: Validate DashScope collection environment
        if: env.LLM_PROVIDER == 'dashscope'
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: infra/scripts/validate-runtime-env.sh collect
      - name: Validate YiCloud collection environment
        if: env.LLM_PROVIDER == 'yicloud'
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          LLM_API_KEY: ${{ secrets.YICLOUD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: infra/scripts/validate-runtime-env.sh collect
      - name: Collect fast sources without blocking healthy groups
        id: collect
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for group in tech capital standards; do
            echo "=== Collecting group: $group ==="
            uv run radar collect --group "$group" || echo "Notice: Group $group completed with some degraded sources."
          done
      - name: Enrich new and materially changed items with DashScope
        if: env.LLM_PROVIDER == 'dashscope'
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ALPHAXIV_ACCESS_TOKEN: ${{ secrets.ALPHAXIV_ACCESS_TOKEN }}
        run: uv run radar enrich
      - name: Enrich new and materially changed items with YiCloud
        if: env.LLM_PROVIDER == 'yicloud'
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          LLM_API_KEY: ${{ secrets.YICLOUD_API_KEY }}
          ALPHAXIV_ACCESS_TOKEN: ${{ secrets.ALPHAXIV_ACCESS_TOKEN }}
        run: uv run radar enrich
      - name: Compose alert batch
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: uv run radar compose --date "$(TZ=Asia/Shanghai date +%F)" --kind alert
      - name: Validate delivery environment
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: infra/scripts/validate-runtime-env.sh delivery
      - name: Deliver idempotent outbox
        env:
          RADAR_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: uv run radar deliver
      - name: Summarize collection status
        if: always()
        run: |
          echo "Collection, enrichment and dispatch cycle finished."
